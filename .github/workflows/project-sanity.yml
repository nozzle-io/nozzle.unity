name: Project Sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  project-sanity:
    name: Package and native boundary sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run project sanity checks
        run: python3 .github/scripts/check_project_sanity.py
